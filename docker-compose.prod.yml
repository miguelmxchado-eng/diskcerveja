services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB: diskcerveja
      POSTGRES_USER: diskcerveja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Só no localhost do VPS — acesse via túnel SSH no DataGrip (nunca exponha 0.0.0.0).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diskcerveja -d diskcerveja"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: diskcerveja
      DB_USER: diskcerveja
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata: {}
