name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Produção (VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend no Spring
        working-directory: frontend
        run: npm ci && npm run sync:backend

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Confiar no host do VPS
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar código
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'backend/target/' \
            --exclude '.env' \
            --exclude 'nginx/certs/' \
            --exclude 'certbot/' \
            --exclude '.github/' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/diskcerveja/"

      - name: Rebuild e reiniciar
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          sudo timedatectl set-timezone America/Sao_Paulo
          cd ~/diskcerveja

          # Certificado: se já existe (Let's Encrypt), não mexe.
          # O check usa -d/sudo porque os arquivos em live/ são root e o -f do ubuntu falha.
          DOMAIN=emporiomachado.duckdns.org
          LIVE="certbot/conf/live/${DOMAIN}"
          if [ ! -d "${LIVE}" ]; then
            sudo mkdir -p "${LIVE}"
            sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout "${LIVE}/privkey.pem" \
              -out "${LIVE}/fullchain.pem" \
              -subj "/CN=${DOMAIN}"
          fi

          # Docker Hub às vezes responde 500 no pull; tenta de novo antes de falhar o deploy.
          attempt=1
          max_attempts=3
          while true; do
            sudo docker compose -f docker-compose.prod.yml --env-file .env pull || true
            if sudo docker compose -f docker-compose.prod.yml --env-file .env up -d --build; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Deploy falhou após ${max_attempts} tentativas (possível instabilidade no Docker Hub)."
              exit 1
            fi
            echo "Tentativa ${attempt}/${max_attempts} falhou. Aguardando 30s para nova tentativa..."
            attempt=$((attempt + 1))
            sleep 30
          done
          EOF
